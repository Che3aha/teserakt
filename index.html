const copy={sr:{eye:'Od ideje do digitalnog iskustva',heading:'Nova dimenzija<br><em>mogućnosti.</em>',intro:'Veb-sajtovi, aplikacije i interaktivno učenje. Pretvaram vaše ideje u jednostavna, korisna i inspirativna digitalna iskustva.',cta:'Razgovarajmo o vašoj ideji',hint:'Izaberite tačku. Otkrijte mogućnosti.',footer:'Kreirajte. Učite. Inspirišite.',prompt:'Imate ideju za projekat?',call:'Pozovite · 6028309737',pause:'Zaustavite rotaciju',play:'Pokrenite rotaciju',close:'Zatvorite',services:[['Veb-sajtovi','Moderni, responzivni sajtovi koji jasno predstavljaju vaš brend. Od jednostavne prezentacije do višejezičnog sajta, sa pažnjom prema izgledu i korišćenju na telefonu.'],['Veb-aplikacije','Interaktivni alati prilagođeni vašem načinu rada. Organizujte sadržaj, pojednostavite zadatke ili pretvorite svoju ideju u aplikaciju koju ljudi koriste direktno u pregledaču.'],['Mobilne aplikacije','Intuitivna iskustva za telefone i tablete. Planiranje i razvoj mobilnih rešenja za iOS i Android, uz pažljivo osmišljene ekrane i jednostavnu navigaciju.'],['Knjiga → aplikacija','Pretvorite priče, vodiče i udžbenike u interaktivno iskustvo. Dodajte animacije, zvuk, zadatke i kvizove koji sadržaj čine pristupačnijim i zanimljivijim.'],['Obrazovni projekti','Učenje kroz igru za decu i odrasle. Interaktivne aktivnosti, kvizovi i obrazovne platforme koje podstiču radoznalost i pomažu da se znanje primeni.'],['UI/UX dizajn','Jasni, promišljeni interfejsi koji se lako koriste. Od strukture i korisničkog toka do vizuelnog dizajna, svaki detalj ima svoju svrhu.'],['Održavanje','Podrška i optimizacija nakon pokretanja. Ažuriranje sadržaja, unapređenje brzine i rešavanje problema kako bi vaš sajt ili aplikacija nastavili da rade pouzdano.'],['Konsultacije','Od prve ideje do jasnog plana. Pomažem vam da definišete potrebe, odaberete odgovarajuće digitalno rešenje i odredite prioritete za sledeći korak.']]},en:{eye:'Ideas into digital experiences',heading:'A new dimension<br><em>of possibilities.</em>',intro:'Websites, apps and interactive learning. I turn your ideas into simple, useful and inspiring digital experiences.',cta:'Let’s talk about your idea',hint:'Choose a point. Explore the possibilities.',footer:'Create. Learn. Inspire.',prompt:'Have a project in mind?',call:'Call · 6028309737',pause:'Pause rotation',play:'Resume rotation',close:'Close',services:[['Websites','Modern, responsive websites built around your brand. From a focused landing page to a multilingual website, with careful attention to design and the mobile experience.'],['Web apps','Interactive tools tailored to the way you work. Organize content, simplify everyday tasks or turn your idea into an app people can use directly in their browser.'],['Mobile apps','Intuitive experiences for phones and tablets. Planning and development of mobile solutions for iOS and Android, with thoughtfully designed screens and clear navigation.'],['Book to app','Turn stories, guides and textbooks into interactive experiences. Bring your content to life with animation, audio, activities and quizzes that invite people to explore.'],['Learning projects','Playful learning for children and adults. Interactive activities, quizzes and educational platforms that encourage curiosity and help people put knowledge into practice.'],['UI/UX design','Clear, thoughtful interfaces that feel easy to use. From structure and user flows to visual design, every detail serves a purpose.'],['Maintenance','Ongoing support and optimization after launch. Content updates, performance improvements and troubleshooting to keep your website or app working reliably.'],['Consulting','Move from a first idea to a clear plan. I help you define your needs, choose a suitable digital solution and prioritize the next steps for your project.']]}};
const symbols=['⌘','⋈','⊞','▱','✳','⊕','⊶','◇'];let lang='sr';try{lang=localStorage.getItem('sk-lang')==='en'?'en':'sr'}catch{}let selected=-1,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,hovered=false,focused=false,angle=0.48;const stage=document.getElementById('stage'),detail=document.getElementById('detail'),motion=document.getElementById('motion');const ns='http://www.w3.org/2000/svg';const verts=Array.from({length:16},(_,i)=>[i&1?1:-1,i&2?1:-1,i&4?1:-1,i&8?1:-1]);const faces=[];for(let a=0;a<4;a++)for(let b=a+1;b<4;b++){for(let base=0;base<16;base++){if((base&(1<<a))||(base&(1<<b)))continue;const ids=[base,base|(1<<a),base|(1<<a)|(1<<b),base|(1<<b)];const el=document.createElementNS(ns,'polygon');el.setAttribute('fill','#111');document.getElementById('faces').append(el);faces.push({ids,el})}}const lines=[];for(let i=0;i<16;i++)for(let j=i+1;j<16;j++){let x=i^j;if((x&(x-1))===0){let el=document.createElementNS(ns,'line');el.setAttribute('stroke',i<8&&j<8?'#242424':'#878787');el.setAttribute('stroke-width','1');document.getElementById('edges').append(el);lines.push([i,j,el])}}const dots=verts.map(()=>{let el=document.createElementNS(ns,'circle');el.setAttribute('r','2.5');el.setAttribute('fill','#111111');document.getElementById('dots').append(el);return el});const rings=verts.slice(0,8).map(()=>{const el=document.createElementNS(ns,'circle');el.setAttribute('fill','none');el.setAttribute('stroke','#111');el.setAttribute('stroke-width','.7');document.getElementById('rings').append(el);return el});const signals=Array.from({length:8},(_,i)=>{const glow=document.createElementNS(ns,'circle');glow.setAttribute('r','4');glow.setAttribute('fill','#111');glow.setAttribute('filter','url(#softGlow)');const core=document.createElementNS(ns,'circle');core.setAttribute('r','1.7');core.setAttribute('fill','#111');const trail=document.createElementNS(ns,'line');trail.setAttribute('stroke','#111');trail.setAttribute('stroke-width','1.4');trail.setAttribute('stroke-linecap','round');document.getElementById('signals').append(trail,glow,core);return {glow,core,trail,edge:(i*5)%lines.length}});const splashLines=lines.map(()=>{const el=document.createElementNS(ns,'line');document.getElementById('splash-geometry').append(el);return el});const pageSections=[...document.querySelectorAll('header,main,footer')];pageSections.forEach(el=>el.inert=true);document.getElementById('splash-open').onclick=()=>{document.getElementById('splash').classList.add('leaving');pageSections.forEach(el=>el.inert=false);setTimeout(()=>{document.getElementById('splash').hidden=true},350)};const buttons=Array.from({length:8},(_,i)=>{let b=document.createElement('button');b.type='button';b.className='node';b.innerHTML='<span class="symbol" aria-hidden="true">'+symbols[i]+'</span><span class="node-label"></span>';b.addEventListener('click',()=>openDetail(i));document.getElementById('nodes').append(b);return b});

function updateDetail(){document.getElementById('detail-symbol').textContent=symbols[selected];document.getElementById('detail-title').textContent=copy[lang].services[selected][0];document.getElementById('detail-copy').textContent=copy[lang].services[selected][1]}
function openDetail(i){selected=i;updateDetail();buttons.forEach((b,j)=>b.classList.toggle('active',i===j));detail.showModal()}
document.getElementById('close').onclick=()=>detail.close();detail.addEventListener('click',e=>{if(e.target===detail){const r=detail.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)detail.close()}});detail.addEventListener('close',()=>buttons.forEach(b=>b.classList.remove('active')));document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));motion.onclick=()=>{paused=!paused;setLang(lang)};stage.addEventListener('pointerenter',()=>hovered=true);stage.addEventListener('pointerleave',()=>hovered=false);stage.addEventListener('focusin',()=>focused=true);stage.addEventListener('focusout',()=>focused=false);
function rotate(v,a,b,t){const c=Math.cos(t),s=Math.sin(t),x=v[a],y=v[b];v[a]=x*c-y*s;v[b]=x*s+y*c}
let last=0,life=0;function draw(time){const dt=Math.min(time-last,40);last=time;if(!paused&&!document.hidden)life+=dt*.00032;if(!paused&&!hovered&&!focused&&!detail.open&&!document.hidden)angle+=dt*.00010;const pts=verts.map(v0=>{let v=[...v0];rotate(v,0,3,.25);rotate(v,0,2,angle);rotate(v,1,2,.37);const scale4=2.9/(3.7-v[3]);const xyz=v.slice(0,3).map(x=>x*scale4);const scale3=5/(5-xyz[2]);return [320+xyz[0]*scale3*155,277+xyz[1]*scale3*155,xyz[2]]});faces.map(f=>({...f,depth:f.ids.reduce((sum,i)=>sum+pts[i][2],0)/4})).sort((a,b)=>a.depth-b.depth).forEach(f=>{f.el.setAttribute('points',f.ids.map(i=>pts[i].slice(0,2).join(',')).join(' '));f.el.setAttribute('opacity',String(.006+Math.max(0,(f.depth+1.5)/3)*.017));document.getElementById('faces').append(f.el)});lines.forEach(([a,b,el])=>{el.setAttribute('x1',pts[a][0]);el.setAttribute('y1',pts[a][1]);el.setAttribute('x2',pts[b][0]);el.setAttribute('y2',pts[b][1]);const depth=Math.max(0,Math.min(1,(pts[a][2]+pts[b][2]+3)/6));el.setAttribute('opacity',String(.2+depth*.65));el.setAttribute('stroke-width',String(.65+depth*.65));el.setAttribute('stroke',depth>.58?'#111':'#777')});splashLines.forEach((el,i)=>{const source=lines[i][2];for(const a of ['x1','y1','x2','y2','stroke','stroke-width','opacity'])el.setAttribute(a,source.getAttribute(a))});dots.forEach((el,i)=>{el.setAttribute('cx',pts[i][0]);el.setAttribute('cy',pts[i][1]);el.setAttribute('r',String(1.7+(pts[i][2]+2)*.4))});rings.forEach((el,i)=>{const pulse=(life*.38+i*.137)%1;el.setAttribute('cx',pts[i][0]);el.setAttribute('cy',pts[i][1]);el.setAttribute('r',String(3+pulse*13));el.setAttribute('opacity',paused?'0':String((1-pulse)*.24))});signals.forEach((s,i)=>{const [a,b]=lines[s.edge],t=(life+i*.123)%1;const x=pts[a][0]+(pts[b][0]-pts[a][0])*t,y=pts[a][1]+(pts[b][1]-pts[a][1])*t;const tail=Math.max(0,t-.065);s.trail.setAttribute('x1',pts[a][0]+(pts[b][0]-pts[a][0])*tail);s.trail.setAttribute('y1',pts[a][1]+(pts[b][1]-pts[a][1])*tail);s.trail.setAttribute('x2',x);s.trail.setAttribute('y2',y);s.trail.setAttribute('opacity',paused?'0':String(Math.sin(t*Math.PI)*.5));[s.glow,s.core].forEach(el=>{el.setAttribute('cx',x);el.setAttribute('cy',y);el.setAttribute('opacity',paused?'0':String(Math.sin(t*Math.PI)*.65))})});const box=stage.getBoundingClientRect(),scale=Math.min(box.width/640,box.height/590),ox=(box.width-640*scale)/2,oy=(box.height-590*scale)/2;const targets=pts.slice(0,8).map((p,i)=>({x:ox+p[0]*scale,y:oy+p[1]*scale,i}));targets.forEach(p=>{const b=buttons[p.i],w=b.offsetWidth,h=b.offsetHeight;p.x=Math.max(w/2+2,Math.min(box.width-w/2-2,p.x));p.y=Math.max(h/2+2,Math.min(box.height-65,p.y))});for(let k=0;k<12;k++)for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){const a=targets[i],b=targets[j],needX=(buttons[i].offsetWidth+buttons[j].offsetWidth)/2+5,needY=34;if(Math.abs(a.x-b.x)<needX&&Math.abs(a.y-b.y)<needY){const push=(needY-Math.abs(a.y-b.y))/2+1;const dir=a.y<=b.y?-1:1;a.y=Math.max(20,Math.min(box.height-60,a.y+push*dir));b.y=Math.max(20,Math.min(box.height-60,b.y-push*dir))}}targets.forEach(p=>{buttons[p.i].style.left=p.x+'px';buttons[p.i].style.top=p.y+'px'});requestAnimationFrame(draw)}setLang(lang);requestAnimationFrame(draw);
